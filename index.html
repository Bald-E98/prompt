<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompts - Collection of Creative Prompts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Light mode */
            --bg-light: #faf7f2;
            --text-dark: #2c2416;
            --text-muted: #6b5d52;
            --card-bg: #fff9f3;
            --accent-primary: #c97c5c;
            --accent-secondary: #d4a574;
            --border-color: #e8ddd3;
            
            /* Dark mode */
            --dark-bg: #1a1410;
            --dark-text: #f5f1eb;
            --dark-text-muted: #b8a899;
            --dark-card-bg: #2a241c;
            --dark-accent-primary: #e89968;
            --dark-border-color: #3d3530;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }

        body.dark-mode {
            background: var(--dark-bg);
            color: var(--dark-text);
        }

        /* Header */
        header {
            position: relative;
            padding: 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        body.dark-mode header {
            border-bottom-color: var(--dark-border-color);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        body.dark-mode .subtitle {
            color: var(--dark-text-muted);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-box {
            padding: 0.7rem 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 0.6rem;
            background: var(--card-bg);
            color: var(--text-dark);
            font-size: 0.95rem;
            width: 100%;
            max-width: 350px;
            transition: border-color 0.3s ease;
        }

        body.dark-mode .search-box {
            background: var(--dark-card-bg);
            border-color: var(--dark-border-color);
            color: var(--dark-text);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* AI Filter Chips */
        .ai-filter {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ai-chip {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            background: var(--bg-light);
            color: var(--text-dark);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        body.dark-mode .ai-chip {
            background: var(--dark-bg);
            border-color: var(--dark-border-color);
            color: var(--dark-text);
        }

        .ai-chip:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .ai-chip.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        body.dark-mode .ai-chip.active {
            background: var(--dark-accent-primary);
            border-color: var(--dark-accent-primary);
        }

        /* Theme Toggle */
        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: var(--accent-primary);
            color: white;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(201, 124, 92, 0.25);
        }

        body.dark-mode .theme-toggle {
            background: var(--dark-accent-primary);
            box-shadow: 0 4px 12px rgba(232, 153, 104, 0.25);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* Sections */
        .sections-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .ai-section {
            margin-bottom: 3rem;
            display: none;
        }

        .ai-section.active {
            display: block;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            color: var(--accent-primary);
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent-primary);
        }

        body.dark-mode .section-title {
            color: var(--dark-accent-primary);
            border-bottom-color: var(--dark-accent-primary);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body.dark-mode .card {
            background: var(--dark-card-bg);
            border-color: var(--dark-border-color);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(201, 124, 92, 0.12);
        }

        body.dark-mode .card:hover {
            box-shadow: 0 12px 32px rgba(232, 153, 104, 0.08);
        }

        /* Carousel */
        .carousel {
            position: relative;
            width: 100%;
            height: 280px;
            background: #000;
            overflow: hidden;
        }

        .carousel-inner {
            display: flex;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .carousel-dot.active {
            background: white;
            width: 24px;
            border-radius: 4px;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
            z-index: 5;
        }

        .carousel-nav:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .carousel-nav.prev {
            left: 10px;
        }

        .carousel-nav.next {
            right: 10px;
        }

        /* Card Content */
        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-prompt {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 1rem;
        }

        body.dark-mode .card-prompt {
            color: var(--dark-text-muted);
        }

        .copy-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 0.4rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        body.dark-mode .copy-btn {
            background: var(--dark-accent-primary);
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(201, 124, 92, 0.2);
        }

        .copy-btn.copied {
            background: var(--accent-secondary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-muted);
        }

        body.dark-mode .empty-state {
            color: var(--dark-text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }

        body.dark-mode footer {
            border-top-color: var(--dark-border-color);
            color: var(--dark-text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Prompts</h1>
        <p class="subtitle">Creative prompts for different AI models</p>
        
        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="Search prompts...">
        </div>

        <div class="ai-filter" id="aiFilter"></div>
    </header>

    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="sections-container" id="sectionsContainer"></div>
    <footer>
    <a href="https://bald-e.neocities.org/" target="_blank">
        @BALD-E 2026
    </a>
    </footer>

    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAP7GL3GnpMEXB3IXfweUWyrCvWxkxvOqM",
    authDomain: "prompt-83be8.firebaseapp.com",
    projectId: "prompt-83be8",
    storageBucket: "prompt-83be8.firebasestorage.app",
    messagingSenderId: "667798558559",
    appId: "1:667798558559:web:161bc9d1388cf0a37688ea"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const searchBox = document.getElementById('searchBox');
  const aiFilter = document.getElementById('aiFilter');
  const sectionsContainer = document.getElementById('sectionsContainer');
  const themeToggle = document.getElementById('themeToggle');
  
  let allData = [];
  let aiModels = new Set();
  let activeAI = null;

  // Theme Toggle
  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    themeToggle.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
  });

  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    themeToggle.textContent = '☀️';
  }

  // Render Sections
  const renderSections = () => {
    const searchTerm = searchBox.value.toLowerCase();
    sectionsContainer.innerHTML = '';

    Array.from(aiModels).forEach(ai => {
      const filtered = allData.filter(item => {
        const matchesSearch = item.prompt.toLowerCase().includes(searchTerm);
        const matchesAI = item.aiModel === ai;
        return matchesSearch && matchesAI;
      });

      if (filtered.length === 0) return;

      const section = document.createElement('div');
      section.className = 'ai-section active';
      section.innerHTML = `<h2 class="section-title">${ai} Prompts</h2><div class="grid" id="grid-${ai}"></div>`;

      const gridEl = section.querySelector(`#grid-${ai}`);
      filtered.forEach((data) => {
        const card = createCard(data);
        gridEl.appendChild(card);
      });

      sectionsContainer.appendChild(section);
    });

    if (sectionsContainer.children.length === 0) {
      sectionsContainer.innerHTML = `<div class="empty-state"><div class="empty-state-icon">✨</div><p>No prompts found</p></div>`;
    }
  };

  // Create Card with Carousel
  const createCard = (data) => {
    const card = document.createElement('div');
    card.className = 'card';

    const imageUrls = Array.isArray(data.imageUrls) ? data.imageUrls : [data.imageUrl || ''];
    const carouselId = `carousel-${Math.random()}`;

    card.innerHTML = `
      <div class="carousel">
        <div class="carousel-inner" id="${carouselId}-inner">
          ${imageUrls.map(url => `<div class="carousel-slide"><img src="${url}" alt="Prompt image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22280%22%3E%3Crect fill=%22%23333%22 width=%22320%22 height=%22280%22/%3E%3C/svg%3E'"></div>`).join('')}
        </div>
        ${imageUrls.length > 1 ? `
          <button class="carousel-nav prev" onclick="carouselPrev('${carouselId}')">❮</button>
          <button class="carousel-nav next" onclick="carouselNext('${carouselId}')">❯</button>
          <div class="carousel-controls" id="${carouselId}-controls">
            ${imageUrls.map((_, i) => `<div class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="carouselGo('${carouselId}', ${i})"></div>`).join('')}
          </div>
        ` : ''}
      </div>
      <div class="card-content">
        <p class="card-prompt">${data.prompt}</p>
        <button class="copy-btn" onclick="copyPrompt(event, '${data.prompt.replace(/'/g, "\\'")}')">Copy Prompt</button>
      </div>
    `;

    return card;
  };

  // Carousel Functions
  window.carouselPrev = (id) => {
    const inner = document.getElementById(`${id}-inner`);
    const slides = inner.children.length;
    const current = Math.round(inner.style.transform.match(/\d+/)?.[0] || 0) / 100;
    const newIndex = (current - 1 + slides) % slides;
    inner.style.transform = `translateX(-${newIndex * 100}%)`;
    updateDots(id, newIndex);
  };

  window.carouselNext = (id) => {
    const inner = document.getElementById(`${id}-inner`);
    const slides = inner.children.length;
    const current = Math.round(inner.style.transform.match(/\d+/)?.[0] || 0) / 100;
    const newIndex = (current + 1) % slides;
    inner.style.transform = `translateX(-${newIndex * 100}%)`;
    updateDots(id, newIndex);
  };

  window.carouselGo = (id, index) => {
    const inner = document.getElementById(`${id}-inner`);
    inner.style.transform = `translateX(-${index * 100}%)`;
    updateDots(id, index);
  };

  const updateDots = (id, index) => {
    const dots = document.querySelectorAll(`#${id}-controls .carousel-dot`);
    dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
  };

  // Copy to Clipboard
  window.copyPrompt = (e, prompt) => {
    navigator.clipboard.writeText(prompt).then(() => {
      e.target.textContent = 'Copied!';
      e.target.classList.add('copied');
      
      setTimeout(() => {
        e.target.textContent = 'Copy Prompt';
        e.target.classList.remove('copied');
      }, 2000);
    });
  };

  // Real-time Firebase Listener
  const q = query(collection(db, "ai_prompts"), orderBy("timestamp", "desc"));
  
  onSnapshot(q, (snapshot) => {
    allData = [];
    aiModels.clear();
    
    snapshot.forEach((doc) => {
      const data = doc.data();
      allData.push(data);
      if (data.aiModel) aiModels.add(data.aiModel);
    });

    // Build AI filter chips
    aiFilter.innerHTML = '<button class="ai-chip active" onclick="filterAI(null)">All</button>';
    Array.from(aiModels).forEach(ai => {
      const chip = document.createElement('button');
      chip.className = 'ai-chip';
      chip.textContent = ai;
      chip.onclick = () => filterAI(ai, chip);
      aiFilter.appendChild(chip);
    });

    renderSections();
  });

  // Filter by AI
  window.filterAI = (ai, element) => {
    activeAI = ai;
    document.querySelectorAll('.ai-chip').forEach(chip => chip.classList.remove('active'));
    if (element) element.classList.add('active');
    else document.querySelector('.ai-chip').classList.add('active');
    
    // Filter sections
    document.querySelectorAll('.ai-section').forEach(section => {
      section.style.display = ai ? 'block' : 'block';
    });
    renderSections();
  };

  // Search
  searchBox.addEventListener('input', renderSections);
</script>

</body>
</html>
