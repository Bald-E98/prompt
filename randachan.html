<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Admin Panel</title>
    <style>
        :root {
            --primary-bg: #0f172a;
            --accent-color: #38bdf8;
            --text-main: #f1f5f9;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .admin-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* AI Type Selector */
        .ai-selector {
            margin-bottom: 20px;
        }

        .ai-selector label {
            display: block;
            color: #64748b;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 12px;
        }

        .ai-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ai-option {
            flex: 1;
            min-width: 120px;
            padding: 10px 15px;
            background: #0f172a;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .ai-option:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .ai-option.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
        }

        /* Image Preview Section */
        .content-box {
            display: flex;
            flex-direction: column;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            min-height: 300px;
        }

        .image-section {
            flex: 8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            padding: 20px;
            position: relative;
        }

        .image-section input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-placeholder {
            text-align: center;
            pointer-events: none;
        }

        .upload-placeholder p {
            margin: 0 0 15px 0;
            color: #94a3b8;
        }

        .preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 15px;
        }

        .preview-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item .remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .preview-item:hover .remove-btn {
            opacity: 1;
        }

        /* Prompt Section */
        .prompt-section {
            flex: 2;
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            padding: 10px;
        }

        .prompt-section textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            resize: none;
            font-size: 14px;
            outline: none;
        }

        /* Main Action Button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .submit-btn:active:not(:disabled) {
            transform: scale(0.98);
            background-color: #7dd3fc;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .status-message.success {
            background: #10b981;
            color: white;
            display: block;
        }

        .status-message.error {
            background: #ef4444;
            color: white;
            display: block;
        }

        .file-count {
            font-size: 12px;
            color: #64748b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Prompt Admin Panel</h1>

    <div class="admin-container">
        <!-- AI Type Selector -->
        <div class="ai-selector">
            <label>Select AI Model:</label>
            <div class="ai-options">
                <button class="ai-option active" data-ai="ChatGPT">ChatGPT</button>
                <button class="ai-option" data-ai="Gemini">Gemini</button>
                <button class="ai-option" data-ai="Claude">Claude</button>
                <button class="ai-option" data-ai="Midjourney">Midjourney</button>
                <button class="ai-option" data-ai="DALL-E">DALL-E</button>
            </div>
        </div>

        <div class="content-box">
            <!-- Image Upload Section -->
            <div class="image-section">
                <div class="upload-placeholder">
                    <p>Tap to select images (2-3 recommended)</p>
                    <div class="preview-container" id="previewContainer"></div>
                    <p class="file-count" id="fileCount"></p>
                </div>
                <input type="file" id="imageInput" accept="image/*" multiple>
            </div>

            <!-- Prompt Section -->
            <div class="prompt-section">
                <textarea id="promptInput" placeholder="Type or paste prompt here..."></textarea>
            </div>
        </div>

        <button class="submit-btn" id="uploadBtn">UPLOAD / ADD TO SITE</button>
        <div class="status-message" id="statusMessage"></div>
    </div>

    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAP7GL3GnpMEXB3IXfweUWyrCvWxkxvOqM",
    authDomain: "prompt-83be8.firebaseapp.com",
    projectId: "prompt-83be8",
    storageBucket: "prompt-83be8.firebasestorage.app",
    messagingSenderId: "667798558559",
    appId: "1:667798558559:web:161bc9d1388cf0a37688ea"
  };

  // Cloudinary Configuration
  const CLOUDINARY_CLOUD_NAME = "dd2mtflmf";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const imageInput = document.getElementById('imageInput');
  const previewContainer = document.getElementById('previewContainer');
  const fileCount = document.getElementById('fileCount');
  const promptInput = document.getElementById('promptInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusMessage = document.getElementById('statusMessage');
  const aiOptions = document.querySelectorAll('.ai-option');
  
  let selectedAI = 'ChatGPT';
  let selectedFiles = [];

  // AI Selection
  aiOptions.forEach(option => {
    option.addEventListener('click', () => {
      aiOptions.forEach(opt => opt.classList.remove('active'));
      option.classList.add('active');
      selectedAI = option.dataset.ai;
    });
  });

  // Preview Logic
  imageInput.addEventListener('change', function() {
    selectedFiles = Array.from(this.files);
    updatePreview();
  });

  const updatePreview = () => {
    previewContainer.innerHTML = '';
    selectedFiles.forEach((file, index) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const preview = document.createElement('div');
        preview.className = 'preview-item';
        preview.innerHTML = `
          <img src="${e.target.result}" alt="Preview">
          <button class="remove-btn" onclick="removeImage(${index})">&times;</button>
        `;
        previewContainer.appendChild(preview);
      };
      reader.readAsDataURL(file);
    });
    fileCount.textContent = `${selectedFiles.length} image${selectedFiles.length !== 1 ? 's' : ''} selected`;
  };

  window.removeImage = (index) => {
    selectedFiles.splice(index, 1);
    imageInput.value = '';
    updatePreview();
  };

  const showStatus = (message, type) => {
    statusMessage.textContent = message;
    statusMessage.className = 'status-message ' + type;
    if (type === 'success') {
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 3000);
    }
  };

  // Upload Logic
  uploadBtn.addEventListener('click', async () => {
    const promptText = promptInput.value.trim();

    if (selectedFiles.length === 0 || !promptText) {
      showStatus('Please select images and enter a prompt!', 'error');
      return;
    }

    uploadBtn.disabled = true;
    uploadBtn.innerText = "UPLOADING...";

    try {
      const imageUrls = [];

      // Upload all images to Cloudinary
      for (const file of selectedFiles) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', 'ml_default');
        formData.append('folder', 'ai-prompts');

        const cloudinaryResponse = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
          {
            method: 'POST',
            body: formData
          }
        );

        const responseData = await cloudinaryResponse.json();
        
        if (!cloudinaryResponse.ok) {
          throw new Error(responseData.error?.message || 'Image upload failed');
        }

        imageUrls.push(responseData.secure_url);
      }

      // Save to Firestore with all image URLs
      await addDoc(collection(db, "ai_prompts"), {
        prompt: promptText,
        imageUrls: imageUrls,
        aiModel: selectedAI,
        timestamp: serverTimestamp()
      });

      showStatus('✓ Success! Added to site', 'success');
      imageInput.value = '';
      promptInput.value = '';
      selectedFiles = [];
      previewContainer.innerHTML = '';
      fileCount.textContent = '';
    } catch (error) {
      console.error('Upload error:', error);
      showStatus('Error: ' + error.message, 'error');
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.innerText = "UPLOAD / ADD TO SITE";
    }
  });
</script>

</body>
</html>
